<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GardenVibe</title>
    <style>
        /* Base styles */
        body {
            font-family: sans-serif;
            background-color: #f0fdf4; /* A light green to match the theme */
        }
        /* Fade-in animation for content switching */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        /* Marquee animation for recipe carousel */
        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee-slow {
            animation: marquee 60s linear infinite;
        }
        .pause-animation:hover {
            animation-play-state: paused;
        }
        /* Jump-in animation for modals */
        @keyframes jumpIn {
          0% { transform: scale(0.5); opacity: 0; }
          70% { transform: scale(1.05); opacity: 1; }
          100% { transform: scale(1); opacity: 1; }
        }
        .animate-jump-in {
            animation: jumpIn 0.3s ease-out forwards;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>

    </script>
</head>

</body>
</html>
